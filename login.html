<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — FCI v1.0 | Barid Al-Maghrib</title>
    <script src="fci-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #003366;
            --dark-blue: #002244;
            --accent-gold: #EAAA00;
            --bg-light: #F1F5F9;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --danger: #DC2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 60%, #004C99 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }
        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 430px;
            border-radius: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.32);
            overflow: hidden;
            border-top: 5px solid var(--accent-gold);
        }
        .login-header {
            background: var(--dark-blue);
            color: #FFFFFF;
            padding: 24px 28px;
            text-align: center;
        }
        .login-header .org {
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--accent-gold);
            line-height: 1.5;
        }
        .login-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }
        .login-header p {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 4px;
        }
        .login-body {
            padding: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary-blue);
            margin-bottom: 6px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrap i.left-icon {
            position: absolute;
            left: 13px;
            color: var(--text-muted);
            font-size: 0.92rem;
        }
        .input-wrap input {
            width: 100%;
            padding: 11px 40px 11px 38px;
            border: 1.5px solid #CBD5E1;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            background: #F8FAFC;
            outline: none;
            transition: all 0.2s;
        }
        .input-wrap input:focus {
            border-color: var(--primary-blue);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.12);
        }
        .toggle-pass {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.92rem;
        }
        .error-box {
            display: none;
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            border-left: 4px solid var(--danger);
            color: #991B1B;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: #FFFFFF;
            border: none;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: var(--dark-blue);
        }
        .login-footer {
            background: #F8FAFC;
            border-top: 1px solid #E2E8F0;
            padding: 14px 24px;
            text-align: center;
            font-size: 0.74rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="org">Direction Contrôle Générale<br>Division Contrôle Permanent · Barid Al-Maghrib</div>
            <h1><i class="fa-solid fa-shield-halved" style="color:var(--accent-gold);"></i> FCI v1.0</h1>
            <p>Fiche de Contrôle Intelligente — Accès Sécurisé</p>
        </div>

        <div class="login-body">
            <div id="loginError" class="error-box">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="loginErrorMsg">Identifiants invalides.</span>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user left-icon"></i>
                        <input type="text" id="username" placeholder="Ex : admin-siege ou CASA-001" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock left-icon"></i>
                        <input type="password" id="password" placeholder="Saisir votre mot de passe" required>
                        <button type="button" class="toggle-pass" id="btnTogglePass" title="Afficher / Masquer">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Se connecter
                </button>
            </form>
        </div>

        <div class="login-footer">
            Accès réservé aux utilisateurs habilités (Siège & Directions Régionales)<br>
            Fiche de contrôle intelligente (FCI) v1.0 © 2026 - 2027
        </div>
    </div>

    <script>
        if (window.FCIAuth && window.FCIAuth.getCurrentUser()) {
            window.location.replace('index.html');
        }

        document.getElementById('btnTogglePass').addEventListener('click', function () {
            const pwd = document.getElementById('password');
            const icon = this.querySelector('i');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const res = window.FCIAuth.login(user, pass);

            if (res.success) {
                window.location.href = 'index.html';
            } else {
                const errBox = document.getElementById('loginError');
                document.getElementById('loginErrorMsg').textContent = res.message;
                errBox.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
