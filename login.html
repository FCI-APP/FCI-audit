<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCI v1.0 - Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #003366;
            --dark-blue: #002244;
            --accent-gold: #EAAA00;
            --bg-light: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 60%, #0A4A8A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .login-header {
            background: var(--dark-blue);
            color: #FFFFFF;
            padding: 26px 24px;
            text-align: center;
            border-bottom: 3px solid var(--accent-gold);
        }

        .login-header .badge-top {
            display: inline-block;
            background: rgba(234, 170, 0, 0.18);
            color: var(--accent-gold);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .login-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .login-header p {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.78);
            margin-top: 6px;
            line-height: 1.4;
        }

        .login-body {
            padding: 26px 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i.prefix-icon {
            position: absolute;
            left: 13px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 40px 11px 38px;
            border: 1px solid #CBD5E1;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-dark);
            background: #F8FAFC;
            outline: none;
            transition: all 0.2s;
        }

        .input-wrap input:focus {
            border-color: var(--primary-blue);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .toggle-pass {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 6px;
            font-size: 0.9rem;
        }

        .toggle-pass:hover { color: var(--primary-blue); }

        .error-box {
            display: none;
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            border-left: 4px solid var(--danger);
            color: #991B1B;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }

        .error-box.visible {
            display: flex;
        }

        .btn-login {
            width: 100%;
            padding: 12px 16px;
            background: var(--primary-blue);
            color: #FFFFFF;
            border: none;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-login:hover:not(:disabled) {
            background: var(--dark-blue);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login-footer {
            background: #F8FAFC;
            border-top: 1px solid var(--border-color);
            padding: 14px 20px;
            text-align: center;
            font-size: 0.74rem;
            color: var(--text-muted);
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <span class="badge-top">Barid Al-Maghrib · Contrôle Permanent</span>
            <h1>Fiche de Contrôle Intelligente (FCI)</h1>
            <p>Direction Contrôle Générale — Connexion à l'espace sécurisé</p>
        </div>

        <div class="login-body">
            <div class="error-box" id="errorBox" role="alert">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Identifiant ou mot de passe incorrect.</span>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Identifiant utilisateur</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user prefix-icon"></i>
                        <input type="text" id="username" name="username" autocomplete="username" placeholder="Saisissez votre identifiant" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock prefix-icon"></i>
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Saisissez votre mot de passe" required>
                        <button type="button" class="toggle-pass" id="togglePassword" aria-label="Afficher ou masquer le mot de passe">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnSubmit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span id="btnLabel">Se connecter</span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            Fiche de contrôle intelligente (FCI) v1.0 © 2026 - 2027<br>
            Accès réservé aux contrôleurs et responsables habilités
        </div>
    </div>

    <script type="module">
        import { loginUser, getCurrentUser } from "./fci-auth.js";

        const form = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.getElementById("togglePassword");
        const toggleIcon = document.getElementById("toggleIcon");
        const errorBox = document.getElementById("errorBox");
        const errorText = document.getElementById("errorText");
        const btnSubmit = document.getElementById("btnSubmit");
        const btnLabel = document.getElementById("btnLabel");

        // Si une session active existe déjà, rediriger directement vers l'accueil
        if (getCurrentUser()) {
            window.location.replace("index.html");
        }

        toggleBtn.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            toggleIcon.className = isPassword ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
        });

        function showError(message) {
            errorText.textContent = message;
            errorBox.classList.add("visible");
        }

        function hideError() {
            errorBox.classList.remove("visible");
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError("Veuillez renseigner votre identifiant et votre mot de passe.");
                return;
            }

            btnSubmit.disabled = true;
            btnLabel.textContent = "Connexion en cours...";

            try {
                await loginUser(username, password);
                window.location.replace("index.html");
            } catch (err) {
                const msg = (err && err.message)
                    ? err.message
                    : "Échec de la connexion. Vérifiez vos identifiants.";
                showError(msg);
                btnSubmit.disabled = false;
                btnLabel.textContent = "Se connecter";
            }
        });
    </script>
</body>
</html>
