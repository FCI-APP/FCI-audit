<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCI v1.0 - Feuille 2 : Planification</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input[type="text"], input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            font-size: 0.9em;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85em;
            color: #64748b;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FCI v1.0 — Feuille 2 : Planification de la Mission</h1>
    
    <div class="form-grid">
        <div class="form-group">
            <label for="datePlanification">Date :</label>
            <input type="date" id="datePlanification">
        </div>
        <div class="form-group">
            <label for="dateDebut">Date Début :</label>
            <input type="date" id="dateDebut">
        </div>
        <div class="form-group">
            <label for="dateFin">Date Fin :</label>
            <input type="date" id="dateFin">
        </div>
        <div class="form-group">
            <label for="entite">Entité contrôlée :</label>
            <input type="text" id="entite" placeholder="Ex: Agence Principale">
        </div>
        <div class="form-group">
            <label for="controleur">Contrôleur :</label>
            <input type="text" id="controleur" placeholder="Nom de l'inspecteur">
        </div>
    </div>

    <h2>Points de Contrôle Sélectionnés</h2>
    <table>
        <thead>
            <tr>
                <th>Processus</th>
                <th>Intitulé du risque</th>
                <th>Intitulé du contrôle</th>
                <th>Point de contrôle</th>
            </tr>
        </thead>
        <tbody id="tablePointsBody">
            <!-- Rempli dynamiquement -->
        </tbody>
    </table>

    <div class="btn-container">
        <button onclick="validerMission()">Valider et Enregistrer dans la BDD</button>
    </div>

    <footer>Fiche de contrôle intelligente (FCI)
v1.0 © 2026 - 2027</footer>
</div>

<!-- 1. Script du Gestionnaire de BDD Centralisée -->
<script src="fci-db-manager.js"></script>

<!-- 2. Logiciel applicatif -->
<script>
    let pointsPlanifies = [];

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById('datePlanification').value = today;

        const savedData = localStorage.getItem('fci_planification_pc');
        if (savedData) {
            pointsPlanifies = JSON.parse(savedData);
            afficherPoints();
        }
    });

    function getItemVal(item, keys) {
        for (let k of keys) {
            if (item && item[k] !== undefined) return item[k];
        }
        return '';
    }

    function afficherPoints() {
        const tbody = document.getElementById('tablePointsBody');
        tbody.innerHTML = '';

        if (pointsPlanifies.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Aucun point de contrôle sélectionné depuis la Feuille 1.</td></tr>';
            return;
        }

        pointsPlanifies.forEach(pt => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${getItemVal(pt, ['Processus', 'processus'])}</td>
                <td>${getItemVal(pt, ['Intitulé du risque', 'Intitulé risque', 'risque'])}</td>
                <td>${getItemVal(pt, ['Points de contrôle', 'Point de contrôle', 'controle'])}</td>
                <td>${getItemVal(pt, ['Intitulé du contrôle', 'Intitulé contrôle', 'pc'])}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function validerMission() {
        const datePlan = document.getElementById('datePlanification').value;
        const dateDebut = document.getElementById('dateDebut').value;
        const dateFin = document.getElementById('dateFin').value;
        const entite = document.getElementById('entite').value;
        const controleur = document.getElementById('controleur').value;

        if (!dateDebut || !dateFin || !entite) {
            alert('Veuillez remplir au moins la date de début, la date de fin et l\'entité.');
            return;
        }

        const idMission = "MIS-" + Date.now();
        const missionData = {
            idMission: idMission,
            date: datePlan,
            dateDebut: dateDebut,
            dateFin: dateFin,
            entite: entite,
            controleur: controleur,
            pointsSelectionnes: pointsPlanifies
        };

        // Enregistrement dans la BDD Centralisée
        FCIDatabase.enregistrerMission(missionData);

        // Sauvegarde temporaire du contexte de mission active
        localStorage.setItem('fci_fiche_controle_active', JSON.stringify(missionData));

        alert('Mission validée et enregistrée avec succès dans la BDD Centralisée !');
        
        // Redirection exacte sans le suffixe '5'
        window.location.href = 'FicheControle.html';
    }
</script>
</body>
</html>
