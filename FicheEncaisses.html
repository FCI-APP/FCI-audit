<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCI v1.0 - Feuille 4 : Fiche de la Vérification des Encaisses</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input[type="number"], input[type="text"], input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .metric-box {
            background: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85em;
            color: #64748b;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FCI v1.0 — Feuille 4 : Fiche de la Vérification des Encaisses</h1>
    
    <div class="form-grid">
        <div class="form-group">
            <label for="dateEncaisse">Date de Vérification :</label>
            <input type="date" id="dateEncaisse">
        </div>
        <div class="form-group">
            <label for="popEncaisse">Population (Total Caisses) :</label>
            <input type="number" id="popEncaisse" min="0" value="0" onchange="updateConstatNumbers()">
        </div>
        <div class="form-group">
            <label for="echEncaisse">Échantillon (Caisses Vérifiées) :</label>
            <input type="number" id="echEncaisse" min="0" value="0" onchange="updateConstatNumbers()">
        </div>
        <div class="form-group">
            <label for="okEncaisse">Nombre OK (Conformes) :</label>
            <input type="number" id="okEncaisse" min="0" value="0" onchange="updateConstatNumbers()">
        </div>
        <div class="form-group">
            <label for="koEncaisse">Nombre KO (Écarts/Anomalies) :</label>
            <input type="number" id="koEncaisse" min="0" value="0" onchange="updateConstatNumbers()">
        </div>
    </div>

    <div class="metric-box">
        <span>Taux de Conformité Encaisses (TC) :</span>
        <span id="tcEncaisseDisplay" style="color: var(--primary);">0.0%</span>
    </div>

    <div class="form-group">
        <label for="constatEncaisseText">Constat / Remarques du Contrôleur :</label>
        <input type="text" id="constatEncaisseText" placeholder="Saisir les remarques de vérification physique des caisses..." style="width: 100%;">
    </div>

    <div class="btn-container">
        <button onclick="enregistrerEncaisseBDD()">Enregistrer la Vérification dans la BDD</button>
    </div>

    <footer>Fiche de contrôle intelligente (FCI)
v1.0 © 2026 - 2027</footer>
</div>

<!-- 1. Script du Gestionnaire de BDD Centralisée -->
<script src="fci-db-manager.js"></script>

<!-- 2. Logiciel applicatif -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dateEncaisse').value = new Date().toISOString().slice(0, 10);
    });

    function updateConstatNumbers() {
        let pop = parseInt(document.getElementById('popEncaisse').value) || 0;
        let ech = parseInt(document.getElementById('echEncaisse').value) || 0;
        let ok = parseInt(document.getElementById('okEncaisse').value) || 0;
        let ko = parseInt(document.getElementById('koEncaisse').value) || 0;

        // Échantillon <= Population
        if (ech > pop) {
            alert("Erreur : L'échantillon ne peut pas être supérieur à la population !");
            document.getElementById('echEncaisse').value = 0;
            ech = 0;
        }

        // Ajustement automatique OK + KO <= Échantillon
        if ((ok + ko) > ech && ech > 0) {
            ko = Math.max(0, ech - ok);
            document.getElementById('koEncaisse').value = ko;
        }

        // Calcul TC (%)
        let tc = 0;
        if (ech > 0) {
            tc = ((ok / ech) * 100).toFixed(1);
        }

        document.getElementById('tcEncaisseDisplay').textContent = tc + '%';
    }

    function enregistrerEncaisseBDD() {
        const savedMission = localStorage.getItem('fci_fiche_controle_active');
        const activeMission = savedMission ? JSON.parse(savedMission) : null;
        const idMission = activeMission ? activeMission.idMission : "MIS-DEFAULT";

        const pop = parseInt(document.getElementById('popEncaisse').value) || 0;
        const ech = parseInt(document.getElementById('echEncaisse').value) || 0;
        const ok = parseInt(document.getElementById('okEncaisse').value) || 0;
        const ko = parseInt(document.getElementById('koEncaisse').value) || 0;
        const tcStr = document.getElementById('tcEncaisseDisplay').textContent.replace('%', '');
        const tc = parseFloat(tcStr) || 0;
        const constat = document.getElementById('constatEncaisseText').value;

        const dataEncaisse = {
            idEncaisse: "ENC-" + Date.now(),
            idMission: idMission,
            date: document.getElementById('dateEncaisse').value,
            processus: "Gestion des Encaisses",
            risque: "Écart de caisse / Manquant d'espèces",
            controle: "Vérification physique des encaisses",
            pc: "Comptage physique des fonds et des valeurs",
            pop: pop,
            ech: ech,
            ok: ok,
            ko: ko,
            tc: tc,
            constat: constat
        };

        // Sauvegarde dans la BDD Centralisée
        FCIDatabase.enregistrerConstatEncaisse(dataEncaisse);

        alert('Vérification des encaisses enregistrée avec succès dans la BDD Centralisée !');
    }
</script>
</body>
</html>
