        <form onSubmit={handleSubmit} className="bg-white rounded-xl border border-slate-200 p-6 shadow-xs space-y-5">
          <div className="flex items-center justify-between pb-3 border-b border-slate-100">
            <div>
              <h3 className="text-base font-bold text-slate-900">
                {initialSheet ? `Modifier ${initialSheet.ref}` : 'Créer une Fiche de Contrôle'}
              </h3>
              <p className="text-xs text-slate-500">Renseignez les détails du contrôle et enregistrez les constats.</p>
            </div>
            <div className="flex gap-2">
              <button type="button" onClick={onCancel} className="px-3 py-1.5 text-xs border rounded-lg hover:bg-slate-50">Annuler</button>
              <button type="submit" className="px-4 py-1.5 text-xs font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700">Enregistrer</button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
            <div>
              <label className="block font-semibold mb-1">Référence</label>
              <input type="text" value={ref} onChange={e => setRef(e.target.value)} required className="w-full px-3 py-2 border rounded-lg bg-slate-50 font-mono" />
            </div>
            <div className="md:col-span-2">
              <label className="block font-semibold mb-1">Intitulé du contrôle</label>
              <input type="text" value={title} onChange={e => setTitle(e.target.value)} required placeholder="Ex: Revue des autorisations de signature" className="w-full px-3 py-2 border rounded-lg" />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div>
              <label className="block font-semibold mb-1">Direction</label>
              <select value={department} onChange={e => setDepartment(e.target.value)} className="w-full px-3 py-2 border rounded-lg">
                <option value="Direction Financière & Comptable">Direction Financière & Comptable</option>
                <option value="Systèmes d'Information & Sécurité">Systèmes d'Information & Sécurité</option>
                <option value="Ressources Humaines">Ressources Humaines</option>
                <option value="Achats & Approvisionnements">Achats & Approvisionnements</option>
                <option value="Opérations & Logistique">Opérations & Logistique</option>
                <option value="Conformité & Juridique">Conformité & Juridique</option>
              </select>
            </div>
            <div>
              <label className="block font-semibold mb-1">Processus audité</label>
              <input type="text" value={process} onChange={e => setProcess(e.target.value)} placeholder="Ex: Clôture mensuelle, IAM, etc." className="w-full px-3 py-2 border rounded-lg" />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div>
              <label className="block font-semibold mb-1">Contrôleur en charge</label>
              <select value={controller} onChange={e => setController(e.target.value)} className="w-full px-3 py-2 border rounded-lg bg-slate-50">
                <option value="AIT BABA ISMAIL (Contrôleur A)">AIT BABA ISMAIL (Contrôleur A)</option>
                <option value="OUJBOUR OMAR (Contrôleur B)">OUJBOUR OMAR (Contrôleur B)</option>
              </select>
            </div>
            <div>
              <label className="block font-semibold mb-1">Responsable / Entité auditée</label>
              <input type="text" value={auditee} onChange={e => setAuditee(e.target.value)} placeholder="Ex: Chef comptable, RSSI, DRH..." className="w-full px-3 py-2 border rounded-lg" />
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 text-xs">
            <div>
              <label className="block font-semibold mb-1">Date</label>
              <input type="date" value={controlDate} onChange={e => setControlDate(e.target.value)} className="w-full px-3 py-2 border rounded-lg font-mono" />
            </div>
            <div>
              <label className="block font-semibold mb-1">Périodicité</label>
              <select value={periodicity} onChange={e => setPeriodicity(e.target.value)} className="w-full px-3 py-2 border rounded-lg">
                <option value="Mensuel">Mensuel</option>
                <option value="Trimestriel">Trimestriel</option>
                <option value="Semestriel">Semestriel</option>
                <option value="Annuel">Annuel</option>
                <option value="Ponctuel">Ponctuel</option>
              </select>
            </div>
            <div>
              <label className="block font-semibold mb-1">Risque</label>
              <select value={riskLevel} onChange={e => setRiskLevel(e.target.value)} className="w-full px-3 py-2 border rounded-lg">
                <option value="Faible">Faible</option>
                <option value="Modéré">Modéré</option>
                <option value="Élevé">Élevé</option>
                <option value="Critique">Critique</option>
              </select>
            </div>
            <div>
              <label className="block font-semibold mb-1">Statut</label>
              <select value={status} onChange={e => setStatus(e.target.value)} className="w-full px-3 py-2 border rounded-lg">
                <option value="Conforme">Conforme</option>
                <option value="Conforme avec réserves">Conforme avec réserves</option>
                <option value="Non conforme">Non conforme</option>
                <option value="En attente">En attente</option>
              </select>
            </div>
          </div>

          <div className="text-xs space-y-3">
            <div>
              <label className="block font-semibold mb-1">Objectifs du contrôle</label>
              <textarea rows={2} value={objectives} onChange={e => setObjectives(e.target.value)} className="w-full px-3 py-2 border rounded-lg" placeholder="Périmètre et assertions contrôlées..." />
            </div>
            <div>
              <label className="block font-semibold mb-1">Méthodologie & Échantillonnage</label>
              <textarea rows={2} value={methodology} onChange={e => setMethodology(e.target.value)} className="w-full px-3 py-2 border rounded-lg" placeholder="Démarche appliquée, documents vérifiés..." />
            </div>
            <div>
              <label className="block font-semibold mb-1">Conclusion synthétique</label>
              <textarea rows={2} value={conclusion} onChange={e => setConclusion(e.target.value)} className="w-full px-3 py-2 border rounded-lg" placeholder="Synthèse de l'évaluateur..." />
            </div>
          </div>

          {/* Findings section */}
          <div className="pt-3 border-t border-slate-100 space-y-3">
            <div className="flex justify-between items-center">
              <h4 className="text-xs font-bold uppercase text-slate-800">Constats & Recommandations ({findings.length})</h4>
              <button type="button" onClick={handleAddFinding} className="text-xs font-semibold text-blue-600 hover:underline">+ Ajouter un constat</button>
            </div>

            {findings.map((f, i) => (
              <div key={f.id} className="p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs space-y-2">
                <div className="flex justify-between items-center">
                  <span className="font-mono font-bold">{f.ref}</span>
                  <button type="button" onClick={() => setFindings(findings.filter((_, idx) => idx !== i))} className="text-rose-600 hover:underline">Supprimer</button>
                </div>
                <input type="text" placeholder="Titre du constat" value={f.title} onChange={e => {
                  const updated = [...findings];
                  updated[i].title = e.target.value;
                  setFindings(updated);
                }} className="w-full px-2 py-1.5 border rounded bg-white" />
                <textarea rows={2} placeholder="Description factuelle et risque" value={f.description} onChange={e => {
                  const updated = [...findings];
                  updated[i].description = e.target.value;
                  setFindings(updated);
                }} className="w-full px-2 py-1.5 border rounded bg-white" />
                <textarea rows={2} placeholder="Recommandation opérationnelle" value={f.recommendation} onChange={e => {
                  const updated = [...findings];
                  updated[i].recommendation = e.target.value;
                  setFindings(updated);
                }} className="w-full px-2 py-1.5 border rounded bg-white" />
              </div>
            ))}
          </div>
        </form>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
