        objectives: 'Vérifier la complétude des pièces obligatoires (titre de séjour, permis de conduire pour postes itinérants) et l\'actualisation des visites d\'information et de prévention.',
        methodology: 'Revue sur pièces d\'un échantillon de 40 dossiers salariés actifs répartis sur les 3 sites logistiques.',
        sampleSize: '40 dossiers examinés sur un effectif total de 280 collaborateurs',
        conclusion: 'Dossiers administratifs tenus avec rigueur. Un point d\'attention concerne le suivi des visites médicales périodiques de 4 caristes nécessitant un renouvellement urgent de CACES.',
        createdAt: '2026-09-28T09:30:00Z',
        updatedAt: '2026-10-02T11:00:00Z',
        findings: [
          {
            id: 'fnd-401',
            ref: 'CST-RH-01',
            title: 'Retard de planification sur 4 renouvellements d\'aptitude médicale CACES',
            severity: 'Moyen',
            category: 'Conformité réglementaire',
            description: 'Les autorisations de conduite interne pour engins de manutention arrivent à échéance sans confirmation de rendez-vous auprès du service de santé interentreprises.',
            risk: 'Mise en cause de la responsabilité de l\'employeur en cas d\'accident de travail avec un engin non couvert.',
            recommendation: 'Mettre en place un tableau de bord d\'alerte automatique à J-60 avant l\'expiration de validité de chaque habilitation.',
            actionPlan: 'Planification prioritaire des rendez-vous médicaux et suspension temporaire d\'affectation des 4 opérateurs sur chariots élévateurs.',
            assignee: 'Émilie Mercier (Responsable Paie & RH)',
            targetDate: '2026-11-10',
            status: 'En cours',
            createdAt: '2026-09-28T14:20:00Z'
          }
        ]
      }
    ];

    const STORAGE_KEY = 'fci_control_sheets_v1';

    // --- MAIN APP COMPONENT ---
    function App() {
      const [sheets, setSheets] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error(e);
        }
        return INITIAL_CONTROL_SHEETS;
      });

      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState(null);
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const s = sessionStorage.getItem('fci_auth_user');
          if (s) return JSON.parse(s);
          const r = sessionStorage.getItem('fci_auth_role');
          if (r) return { id: r, name: r === 'siege' ? 'Siège (Vue Globale)' : r === 'ctrl-b' ? 'OUJBOUR OMAR' : 'AIT BABA ISMAIL', role: r === 'siege' ? 'siege' : 'controleur', department: 'Contrôle Interne' };
        } catch (e) {}
        return null;
      });

      const currentRole = currentUser ? currentUser.id : null;

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError(null);
        const u = loginUsername.trim();
        const p = loginPassword.trim();
        if (!u || !p) {
          setLoginError('Veuillez renseigner votre identifiant et votre mot de passe.');
          return;
        }

        const normU = u.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const normP = p.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        let profile = null;

        // Siège detection
        if (normU === 'siege' || normU.includes('siege') || normU === 'direction generale audit' || normU === 'admin') {
          if (normP === 'siege-s' || normP === 'sieges' || normP === 'siege') {
            profile = { id: 'siege', name: 'Direction Générale Audit', role: 'siege', label: 'Siège (Vue Globale)', department: 'Supervision Globale Groupe' };
          }
        } else if (normU.includes('ait baba') || normU === 'ctrl-a' || normU === 'aitbaba') {
          if (normP === 'ait baba-i' || normP === 'aitbaba-i' || normP === 'fci-2026') {
            profile = { id: 'ctrl-a', name: 'AIT BABA ISMAIL', role: 'controleur', label: 'AIT BABA ISMAIL (Contrôleur A)', department: 'Direction Financière & Comptable' };
          }
        } else if (normU.includes('oujbour') || normU === 'ctrl-b') {
          if (normP === 'oujbour-o' || normP === 'fci-2026') {
            profile = { id: 'ctrl-b', name: 'OUJBOUR OMAR', role: 'controleur', label: 'OUJBOUR OMAR (Contrôleur B)', department: 'Achats, Moyens Généraux & Juridique' };
          }
        } else if (p.length >= 4) {
          // Dynamic controller support (>20 controllers)
          const name = u.toUpperCase();
          const ctrlId = 'ctrl-' + normU.replace(/[^a-z0-9]/g, '-');
          profile = { id: ctrlId, name, role: 'controleur', label: `${name} (Contrôleur Interne)`, department: 'Direction du Contrôle Interne' };
        }

        if (profile) {
          setCurrentUser(profile);
          try {
            sessionStorage.setItem('fci_auth_user', JSON.stringify(profile));
            sessionStorage.setItem('fci_auth_role', profile.id);
          } catch (e) {}
          showToast(`Bienvenue, ${profile.name}.`);
          setLoginUsername('');
          setLoginPassword('');
        } else {
          setLoginError('Identifiant ou mot de passe incorrect.');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        try {
          sessionStorage.removeItem('fci_auth_user');
          sessionStorage.removeItem('fci_auth_role');
        } catch (e) {}
        setEditingSheet(null);
        setDetailModalSheet(null);
        showToast('Déconnexion effectuée.');
      };

      const [activeView, setActiveView] = useState('dashboard');
      const [editingSheet, setEditingSheet] = useState(null);
      const [detailModalSheet, setDetailModalSheet] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedStatus, setSelectedStatus] = useState('Tous');
      const [selectedRisk, setSelectedRisk] = useState('Tous');
      const [toast, setToast] = useState(null);

      // Save to localStorage whenever sheets change
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sheets));
        } catch (e) {
          console.error('Storage error', e);
        }
      }, [sheets]);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3500);
      };

      // Visible sheets according to role:
      // Contrôleur : ses propres contrôles (controleur_id === role)
      // Siège : 100% des contrôles
      const visibleSheets = useMemo(() => {
        if (currentRole === 'siege') return sheets;
        return sheets.filter(s => s.controleur_id === currentRole);
      }, [sheets, currentRole]);

      // Export / Backup data as JSON file
      const handleExportJSON = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(sheets, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', `FCI_Sauvegarde_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Sauvegarde JSON téléchargée avec succès.');
      };

      // Helper to generate file timestamp
      const getFileTimestamp = () => {
        const d = new Date();
        return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
      };

      const getProfileInfo = () => {
        const pName = currentUser ? currentUser.name : (currentRole === 'siege' ? 'Direction Générale Audit' : currentRole === 'ctrl-b' ? 'OUJBOUR OMAR' : 'AIT BABA ISMAIL');
        const pLabel = currentUser ? (currentUser.label || currentUser.name) : (currentRole === 'siege' ? 'Siège (Vue Globale)' : currentRole === 'ctrl-b' ? 'OUJBOUR OMAR (Contrôleur B)' : 'AIT BABA ISMAIL (Contrôleur A)');
        return { name: pName, label: pLabel };
      };

      // Export Control Sheets to Excel
      const handleExportControlSheetsExcel = (targetSheets) => {
        if (typeof XLSX === 'undefined') {
          showToast('Bibliothèque Excel (XLSX) indisponible.', 'error');
          return;
        }
        const dataToExport = targetSheets || filteredSheets;
        const profile = getProfileInfo();
        const wb = XLSX.utils.book_new();

        const sheetData = dataToExport.map(s => ({
          'Réf. Contrôle': s.ref,
          'Titre de la mission': s.title,
          'Direction': s.department,
          'Processus': s.process,
          'Contrôleur': s.controller,
          'Audité': s.auditee,
          'Date de réalisation': s.controlDate || s.date,
          'Périodicité': s.periodicity,
          'Type': s.type,
          'Niveau de risque': s.riskLevel,
          'Statut conformité': s.status,
          'Nb Constats': s.findings ? s.findings.length : 0,
          'Objectifs': s.objectives || '',
          'Méthodologie': s.methodology || '',
          'Échantillon': s.sampleSize || '',
          'Conclusion': s.conclusion || ''
        }));
        const wsSheets = XLSX.utils.json_to_sheet(sheetData);
        XLSX.utils.book_append_sheet(wb, wsSheets, 'Fiches de Contrôle');

        const findingsData = dataToExport.flatMap(s => (s.findings || []).map(f => ({
          'Réf. Fiche': s.ref,
          'Mission': s.title,
          'Direction': s.department,
          'Réf. Constat': f.ref,
          'Intitulé': f.title,
          'Gravité': f.severity,
          'Catégorie': f.category,
          'Statut': f.status,
          'Description': f.description,
          'Risque': f.risk,
          'Recommandation': f.recommendation,
          'Plan d\'action': f.actionPlan,
          'Responsable': f.assignee,
          'Échéance': f.targetDate
        })));
        const wsFindings = XLSX.utils.json_to_sheet(findingsData);
        XLSX.utils.book_append_sheet(wb, wsFindings, 'Constats Rattachés');

        const metadata = [
          { 'Propriété': 'Application', 'Valeur': 'FCI – Fiche de Contrôle Intelligente' },
          { 'Propriété': 'Date d\'exportation', 'Valeur': new Date().toLocaleString('fr-FR') },
          { 'Propriété': 'Profil actif', 'Valeur': `${profile.name} (${profile.label})` },
          { 'Propriété': 'Périmètre', 'Valeur': currentRole === 'siege' ? 'Consolidé Siège (Toutes les fiches)' : 'Contrôles personnels' },
          { 'Propriété': 'Nombre de fiches', 'Valeur': dataToExport.length }
        ];
        const wsMeta = XLSX.utils.json_to_sheet(metadata);
        XLSX.utils.book_append_sheet(wb, wsMeta, 'Métadonnées');

        XLSX.writeFile(wb, `FCI_Controles_${profile.name.replace(/\s+/g, '_')}_${getFileTimestamp()}.xlsx`);
        showToast('Export Excel des fiches de contrôle généré avec succès.');
      };

      // Export Findings to Excel
      const handleExportFindingsExcel = () => {
        if (typeof XLSX === 'undefined') {
          showToast('Bibliothèque Excel (XLSX) indisponible.', 'error');
          return;
        }
        const profile = getProfileInfo();
        const wb = XLSX.utils.book_new();

        const findingsData = allFindings.map(f => ({
          'Réf. Constat': f.ref,
          'Réf. Fiche Contrôle': f.sheetRef || 'N/A',
          'Titre du Contrôle': f.sheetTitle || 'N/A',
          'Intitulé de l\'écart': f.title,
          'Gravité': f.severity,
          'Catégorie': f.category,
          'Statut': f.status,
          'Description factuelle': f.description,
          'Risque': f.risk,
          'Recommandation': f.recommendation,
          'Plan d\'action': f.actionPlan,
          'Responsable': f.assignee,
          'Échéance cible': f.targetDate
        }));
        const wsFindings = XLSX.utils.json_to_sheet(findingsData);
        XLSX.utils.book_append_sheet(wb, wsFindings, 'Registre Constats');

        const metadata = [
          { 'Propriété': 'Application', 'Valeur': 'FCI – Fiche de Contrôle Intelligente' },
          { 'Propriété': 'Date d\'exportation', 'Valeur': new Date().toLocaleString('fr-FR') },
          { 'Propriété': 'Profil actif', 'Valeur': `${profile.name} (${profile.label})` },
          { 'Propriété': 'Périmètre', 'Valeur': currentRole === 'siege' ? 'Consolidé Siège' : 'Constats rattachés à ses fiches' },
          { 'Propriété': 'Total constats', 'Valeur': findingsData.length }
        ];
        const wsMeta = XLSX.utils.json_to_sheet(metadata);
        XLSX.utils.book_append_sheet(wb, wsMeta, 'Métadonnées');

        XLSX.writeFile(wb, `FCI_Constats_${profile.name.replace(/\s+/g, '_')}_${getFileTimestamp()}.xlsx`);
        showToast('Export Excel du registre des constats généré avec succès.');
      };

      // Export complete synthetic 3-sheet workbook
      const handleExportSyntheticWorkbookExcel = () => {
        if (typeof XLSX === 'undefined') {
          showToast('Bibliothèque Excel (XLSX) indisponible.', 'error');
          return;
        }
        const profile = getProfileInfo();
        const wb = XLSX.utils.book_new();

        // 1. Calculs globaux
        const totalControls = visibleSheets.length;
        const compliant = visibleSheets.filter(s => s.status === 'Conforme').length;
        const compliantWithReservations = visibleSheets.filter(s => s.status === 'Conforme avec réserves').length;
        const nonCompliant = visibleSheets.filter(s => s.status === 'Non conforme').length;
        const pending = visibleSheets.filter(s => s.status === 'En attente').length;
        const compRate = totalControls > 0
          ? Math.round(((compliant + compliantWithReservations * 0.5) / totalControls) * 100)
          : 0;

        const openFnds = allFindings.filter(f => f.status !== 'Clôturé');
        const closedFnds = allFindings.filter(f => f.status === 'Clôturé');
        const critFnds = openFnds.filter(f => f.severity === 'Critique');
        const majFnds = openFnds.filter(f => f.severity === 'Majeur');
        const medFnds = openFnds.filter(f => f.severity === 'Moyen');
        const lowFnds = openFnds.filter(f => f.severity === 'Faible');

        // Statistiques par contrôleur
        const controllersMap = {};
        visibleSheets.forEach(s => {
          const ctrl = s.controller || 'Non assigné';
          if (!controllersMap[ctrl]) {
            controllersMap[ctrl] = { total: 0, conforme: 0, reserves: 0, nonConforme: 0, attente: 0, findingsCount: 0, findingsClosed: 0 };
          }
          controllersMap[ctrl].total += 1;
          if (s.status === 'Conforme') controllersMap[ctrl].conforme += 1;
          if (s.status === 'Conforme avec réserves') controllersMap[ctrl].reserves += 1;
          if (s.status === 'Non conforme') controllersMap[ctrl].nonConforme += 1;
          if (s.status === 'En attente') controllersMap[ctrl].attente += 1;
          (s.findings || []).forEach(f => {
            controllersMap[ctrl].findingsCount += 1;
            if (f.status === 'Clôturé') controllersMap[ctrl].findingsClosed += 1;
          });
        });

        const ctrlRows = Object.keys(controllersMap).map(ctrl => {
          const st = controllersMap[ctrl];
          const rate = st.total > 0 ? Math.round(((st.conforme + st.reserves * 0.5) / st.total) * 100) : 0;
          return [ctrl, st.total, `${rate}%`, st.conforme, st.reserves, st.nonConforme, st.attente, st.findingsCount, st.findingsClosed];
        });

        // ONGLET 1 : Tableau de Bord & Indicateurs
        const dashboardRows = [
          ['FCI – FICHE DE CONTRÔLE INTELLIGENTE'],
          ['TABLEAU DE BORD & INDICATEURS DE CONTRÔLE INTERNE'],
          [],
          ['1. PÉRIMÈTRE & HABILITATION'],
          ['Profil connecté', `${profile.name} (${profile.label})`],
          ['Périmètre d\'extraction', currentRole === 'siege' ? 'Consolidation Globale (Tous les contrôleurs)' : `Contrôleur : ${profile.name}`],
          ['Date d\'extraction', new Date().toLocaleString('fr-FR')],
          ['Système source', 'Base FCI Autonome (FCI.html)'],
          [],
          ['2. INDICATEURS CLÉS DU CONTRÔLE INTERNE'],
          ['Indicateur', 'Valeur', 'Commentaire / Objectif'],
          ['Total des fiches de contrôle', totalControls, 'Revues de contrôle enregistrées'],
          ['Taux de conformité global', `${compRate}%`, 'Conformes (100%) + Réserves (50%)'],
          ['Contrôles Conformes', compliant, 'Sans réserve'],
          ['Contrôles Conformes avec réserves', compliantWithReservations, 'Avec points d\'attention'],
          ['Contrôles Non conformes', nonCompliant, 'Écarts substantiels'],
          ['Contrôles En attente', pending, 'En cours de finalisation'],
          [],
          ['3. SUIVI DES CONSTATS & ACTIONS CORRECTIVES'],
          ['Indicateur', 'Valeur', 'Commentaire / Objectif'],
          ['Total des constats identifiés', allFindings.length, 'Écarts relevés'],
          ['Constats ouverts (À traiter / En cours)', openFnds.length, 'Actions correctives actives'],
          ['Constats fermés (Clôturés)', closedFnds.length, 'Actions soldées'],
          ['Taux de résolution des recommandations', allFindings.length > 0 ? `${Math.round((closedFnds.length / allFindings.length) * 100)}%` : '100%', 'Pourcentage soldé'],
          ['Constats Critiques', critFnds.length, 'Risque maximal'],
          ['Constats Majeurs', majFnds.length, 'Risque élevé'],
          ['Constats Moyens', medFnds.length, 'Risque modéré'],
          ['Constats Faibles', lowFnds.length, 'Point de vigilance'],
          [],
          ['4. STATISTIQUES PAR CONTRÔLEUR'],
          ['Contrôleur responsable', 'Nombre de contrôles', 'Taux de conformité', 'Conformes', 'Avec réserves', 'Non conformes', 'En attente', 'Total constats', 'Constats clôturés'],
          ...ctrlRows
        ];

        const wsDashboard = XLSX.utils.aoa_to_sheet(dashboardRows);
        wsDashboard['!cols'] = [{ wch: 38 }, { wch: 22 }, { wch: 55 }, { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 16 }, { wch: 18 }];
        XLSX.utils.book_append_sheet(wb, wsDashboard, 'Tableau de Bord & Indicateurs');

        // ONGLET 2 : Fiches de Contrôle
        const sheetsDetail = visibleSheets.map((s, idx) => {
          let score = 'En attente';
          if (s.status === 'Conforme') score = '100%';
          else if (s.status === 'Conforme avec réserves') score = '50%';
          else if (s.status === 'Non conforme') score = '0%';
          return {
            'N°': idx + 1,
            'ID': s.ref,
            'Date': s.controlDate || s.date,
            'Chantier/Site': s.department,
            'Contrôleur': s.controller,
            'Note/Score': score,
            'Statut': s.status,
            'Processus audité': s.process,
            'Titre de la mission': s.title,
            'Audité (Interlocuteur)': s.auditee,
            'Niveau de risque': s.riskLevel,
            'Type de contrôle': s.type,
            'Périodicité': s.periodicity,
            'Nb Constats associés': (s.findings || []).length,
            'Échantillon / Périmètre testé': s.sampleSize || 'Non précisé',
            'Objectifs du contrôle': s.objectives || '',
            'Conclusion & Avis général': s.conclusion || ''
          };
        });
        const wsSheets = XLSX.utils.json_to_sheet(sheetsDetail.length > 0 ? sheetsDetail : [{ 'Info': 'Aucune fiche' }]);
        XLSX.utils.book_append_sheet(wb, wsSheets, 'Fiches de Contrôle');

        // ONGLET 3 : Constats & Recommandations
        const findingsDetail = allFindings.map((f, idx) => ({
          'N°': idx + 1,
          'Réf. Constat': f.ref,
          'Réf. Fiche Contrôle': f.sheetRef || '',
          'Chantier/Site': f.parentSheet ? f.parentSheet.department : '',
          'Titre du Contrôle': f.sheetTitle || '',
          'Contrôleur responsable': f.parentSheet ? f.parentSheet.controller : '',
          'Écart observé (Intitulé)': f.title,
          'Gravité / Priorité': f.severity,
          'Catégorie': f.category,
          'Statut d\'avancement': f.status,
          'Description factuelle de l\'écart': f.description,
          'Risque identifié': f.risk,
          'Recommandation d\'audit': f.recommendation,
          'Actions correctives préconisées': f.actionPlan,
          'Responsable de mise en œuvre': f.assignee,
          'Échéance cible': f.targetDate
        }));
        const wsFindings = XLSX.utils.json_to_sheet(findingsDetail.length > 0 ? findingsDetail : [{ 'Info': 'Aucun constat' }]);
        XLSX.utils.book_append_sheet(wb, wsFindings, 'Constats & Recommandations');

        XLSX.writeFile(wb, `FCI_Export_${profile.name.replace(/\s+/g, '_')}_${getFileTimestamp()}.xlsx`);
        showToast('Classeur Excel structuré (3 onglets) exporté avec succès.');
      };

      // Export Dashboard to Excel
      const handleExportDashboardExcel = () => {
        handleExportSyntheticWorkbookExcel();
      };

      // Export Single Control Sheet to Excel
      const handleExportSingleSheetExcel = (s) => {
        if (typeof XLSX === 'undefined') {
          showToast('Bibliothèque Excel (XLSX) indisponible.', 'error');
          return;
        }
        const profile = getProfileInfo();
        const wb = XLSX.utils.book_new();

        const general = [
          { 'Champ': 'Réf. Contrôle', 'Valeur': s.ref },
          { 'Champ': 'Titre de la mission', 'Valeur': s.title },
          { 'Champ': 'Direction', 'Valeur': s.department },
          { 'Champ': 'Processus audité', 'Valeur': s.process },
          { 'Champ': 'Contrôleur responsable', 'Valeur': s.controller },
          { 'Champ': 'Audité', 'Valeur': s.auditee },
          { 'Champ': 'Date de réalisation', 'Valeur': s.controlDate || s.date },
          { 'Champ': 'Périodicité', 'Valeur': s.periodicity },
          { 'Champ': 'Type de contrôle', 'Valeur': s.type },
          { 'Champ': 'Niveau de risque', 'Valeur': s.riskLevel },
          { 'Champ': 'Statut conformité', 'Valeur': s.status },
          { 'Champ': 'Échantillon', 'Valeur': s.sampleSize || '' },
          { 'Champ': 'Objectifs', 'Valeur': s.objectives || '' },
          { 'Champ': 'Méthodologie', 'Valeur': s.methodology || '' },
          { 'Champ': 'Conclusion générale', 'Valeur': s.conclusion || '' }
        ];
        const wsGen = XLSX.utils.json_to_sheet(general);
        XLSX.utils.book_append_sheet(wb, wsGen, 'Fiche');

        const findings = (s.findings || []).map(f => ({
          'Réf. Constat': f.ref,
          'Intitulé': f.title,
          'Gravité': f.severity,
          'Catégorie': f.category,
          'Statut': f.status,
          'Description': f.description,
          'Risque': f.risk,
          'Recommandation': f.recommendation,
          'Plan d\'action': f.actionPlan,
          'Responsable': f.assignee,
          'Échéance': f.targetDate
        }));
        const wsFindings = XLSX.utils.json_to_sheet(findings.length > 0 ? findings : [{ 'Info': 'Aucun constat' }]);
        XLSX.utils.book_append_sheet(wb, wsFindings, 'Constats');

        XLSX.writeFile(wb, `FCI_Fiche_${s.ref}_${getFileTimestamp()}.xlsx`);
        showToast(`Fiche ${s.ref} exportée en Excel avec succès.`);
      };

      // Contextual Excel export for the active view
      const handleExportCurrentViewExcel = () => {
        if (activeView === 'dashboard' || activeView === 'report') {
          handleExportSyntheticWorkbookExcel();
        } else if (activeView === 'controls') {
          handleExportControlSheetsExcel(filteredSheets);
        } else if (activeView === 'findings') {
          handleExportFindingsExcel();
        } else if (detailModalSheet) {
          handleExportSingleSheetExcel(detailModalSheet);
        } else {
          handleExportSyntheticWorkbookExcel();
        }
      };

      // Import JSON backup
      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              setSheets(imported);
              showToast(`${imported.length} fiches importées avec succès.`);
            } else {
              alert('Le fichier importé n\'est pas un format valide.');
            }
          } catch (err) {
            alert('Erreur lors de la lecture du fichier JSON.');
          }
        };
        reader.readAsText(file);
      };

      // Save control sheet (create or edit)
      const handleSaveSheet = (sheetData) => {
        const controleur_id = sheetData.controleur_id || (currentUser ? currentUser.id : 'ctrl-a');
        const controller = sheetData.controller || (currentUser ? currentUser.name : 'AIT BABA ISMAIL');
        const enrichedSheet = {
          ...sheetData,
          controleur_id,
          controller,
          date: sheetData.date || sheetData.controlDate || new Date().toISOString().split('T')[0]
        };
        const exists = sheets.some(s => s.id === enrichedSheet.id);
        let updated;
        if (exists) {
          updated = sheets.map(s => s.id === enrichedSheet.id ? enrichedSheet : s);
          showToast(`Fiche ${enrichedSheet.ref} mise à jour.`);
        } else {
          updated = [enrichedSheet, ...sheets];
          showToast(`Fiche ${enrichedSheet.ref} créée avec succès.`);
        }
        setSheets(updated);
        setEditingSheet(null);
        setActiveView('controls');
      };

      // Delete sheet
      const handleDeleteSheet = (id) => {
        const target = sheets.find(s => s.id === id);
        if (window.confirm(`Confirmez-vous la suppression du contrôle ${target ? target.ref : ''} ?`)) {
          setSheets(sheets.filter(s => s.id !== id));
          showToast('Fiche de contrôle supprimée.');
        }
      };

      // Duplicate sheet
      const handleDuplicateSheet = (sheet) => {
        const newRef = `${sheet.ref.split('-').slice(0, 3).join('-')}-${Math.floor(100 + Math.random() * 900)}`;
        const copy = {
          ...sheet,
          id: `fci-${Date.now()}`,
          ref: newRef,
          title: `${sheet.title} (Copie)`,
          controlDate: new Date().toISOString().split('T')[0],
          status: 'En attente',
          findings: sheet.findings.map(f => ({
            ...f,
            id: `fnd-${Date.now()}-${Math.random()}`,
            status: 'À traiter'
          }))
        };
        setSheets([copy, ...sheets]);
        showToast(`Contrôle dupliqué sous la référence ${newRef}.`);
      };

      // Update finding status
      const handleUpdateFindingStatus = (sheetId, findingId, newStatus) => {
        const updated = sheets.map(s => {
          if (s.id === sheetId) {
            return {
              ...s,
              findings: s.findings.map(f => f.id === findingId ? { ...f, status: newStatus } : f)
            };
          }
          return s;
        });
        setSheets(updated);
        showToast(`Statut du constat mis à jour : "${newStatus}".`);
      };

      // Reset to demo data
      const handleResetDemo = () => {
        if (window.confirm('Voulez-vous réinitialiser le jeu de données d\'exemple ?')) {
          setSheets(INITIAL_CONTROL_SHEETS);
          showToast('Données d\'exemple réinitialisées.');
        }
      };

      // Aggregates for Dashboard (scoped to visible sheets according to active profile)
      const totalCount = visibleSheets.length;
      const compliantCount = visibleSheets.filter(s => s.status === 'Conforme').length;
      const compliantWithResCount = visibleSheets.filter(s => s.status === 'Conforme avec réserves').length;
      const nonCompliantCount = visibleSheets.filter(s => s.status === 'Non conforme').length;
      const pendingCount = visibleSheets.filter(s => s.status === 'En attente').length;
      const complianceRate = totalCount > 0 ? Math.round(((compliantCount + compliantWithResCount * 0.5) / totalCount) * 100) : 0;

      const allFindings = visibleSheets.flatMap(s => s.findings.map(f => ({ ...f, sheetId: s.id, sheetRef: s.ref, sheetTitle: s.title, parentSheet: s })));
      const openFindings = allFindings.filter(f => f.status !== 'Clôturé');

      // Filtered sheets
      const filteredSheets = visibleSheets.filter(s => {
        if (searchTerm.trim()) {
          const q = searchTerm.toLowerCase();
          const matchRef = s.ref.toLowerCase().includes(q);
          const matchTitle = s.title.toLowerCase().includes(q);
          const matchDept = s.department.toLowerCase().includes(q);
          const matchProc = s.process.toLowerCase().includes(q);
          if (!matchRef && !matchTitle && !matchDept && !matchProc) return false;
        }
        if (selectedStatus !== 'Tous' && s.status !== selectedStatus) return false;
        if (selectedRisk !== 'Tous' && s.riskLevel !== selectedRisk) return false;
        return true;
      });

      // If unauthenticated, render the universal login view
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-100 flex flex-col justify-center items-center p-4 sm:p-6 font-sans">
            <div className="max-w-md w-full space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white shadow-md mb-2">
                  <Icons.ShieldCheck className="w-8 h-8" />
                </div>
                <h1 className="text-2xl font-bold tracking-tight text-slate-900">
                  FCI – Contrôle Interne
                </h1>
                <p className="text-xs text-slate-500 max-w-sm mx-auto">
                  Portail d'authentification multi-utilisateurs. Connectez-vous avec vos identifiants professionnels pour accéder à votre espace de travail.
                </p>
              </div>

              <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8 space-y-5">
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                      Identifiant / Nom d'utilisateur
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <Icons.User className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        value={loginUsername}
                        onChange={e => { setLoginUsername(e.target.value); if (loginError) setLoginError(null); }}
                        placeholder="Ex: AIT BABA ISMAIL, OUJBOUR OMAR, Siège..."
                        required
                        autoFocus
                        className="w-full pl-10 pr-3.5 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition-all placeholder:text-slate-400"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
                      Mot de passe
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <Icons.Lock className="w-4 h-4" />
                      </div>
                      <input
                        type="password"
                        value={loginPassword}
                        onChange={e => { setLoginPassword(e.target.value); if (loginError) setLoginError(null); }}
                        placeholder="••••••••"
                        required
                        className="w-full pl-10 pr-3.5 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition-all placeholder:text-slate-400"
                      />
                    </div>
                    {loginError && (
                      <div className="mt-2.5 p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
                        <Icons.AlertTriangle className="w-4 h-4 text-rose-600 shrink-0" />
                        <span>{loginError}</span>
                      </div>
                    )}
                  </div>

                  <button
                    type="submit"
                    className="w-full mt-2 py-2.5 px-4 rounded-xl text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-sm hover:shadow flex items-center justify-center gap-2"
                  >
                    <Icons.Lock className="w-4 h-4" />
                    <span>Se connecter à l'espace FCI</span>
                  </button>
                </form>

                <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                  <span className="flex items-center gap-1.5">
                    <Icons.Shield className="w-3.5 h-3.5 text-slate-400" />
                    Environnement sécurisé
                  </span>
                  <span>Isolation des données par contrôleur</span>
                </div>
              </div>
            </div>
            {toast && (
              <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2">
                <Icons.CheckCircle2 className="w-4 h-4 text-emerald-400" />
                <span>{toast}</span>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="flex h-screen bg-slate-50 text-slate-800 overflow-hidden font-sans">
          {/* SIDEBAR */}
          <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 h-screen sticky top-0 border-r border-slate-800 no-print select-none">
            <div className="p-5 border-b border-slate-800">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm font-bold text-lg">
                  <Icons.ShieldCheck className="w-6 h-6" />
                </div>
                <div className="min-w-0">
                  <h1 className="text-base font-bold text-white tracking-tight leading-tight truncate">
                    FCI Contrôle
                  </h1>
                  <p className="text-xs text-slate-400 truncate">
                    Version Autonome (FCI.html)
                  </p>
                </div>
              </div>
            </div>

            <nav className="p-3 space-y-1 flex-1 overflow-y-auto">
              <div className="px-3 py-2 text-[11px] font-semibold tracking-wider text-slate-400 uppercase">
                Menu Principal
              </div>

              {[
                { id: 'dashboard', label: 'Tableau de bord', icon: Icons.LayoutDashboard },
                { id: 'controls', label: 'Fiches de contrôle', icon: Icons.FileCheck2, badge: sheets.length },
                { id: 'new-control', label: 'Nouveau contrôle', icon: Icons.FilePlus2 },
                { id: 'findings', label: 'Constats & Recommandations', icon: Icons.AlertTriangle, badge: openFindings.length },
                { id: 'methodology', label: 'Guide & Normes', icon: Icons.BookOpen }
              ].map(item => {
                const Icon = item.icon;
                const isActive = activeView === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => {
                      if (item.id === 'new-control') setEditingSheet(null);
                      setActiveView(item.id);
                    }}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-left ${
                      isActive ? 'bg-blue-600 text-white font-semibold shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center gap-3 truncate">
                      <Icon className={`w-4 h-4 shrink-0 ${isActive ? 'text-white' : 'text-slate-400'}`} />
                      <span className="truncate">{item.label}</span>
                    </div>
                    {item.badge !== undefined && item.badge !== null && (
                      <span className={`text-xs font-mono tabular-nums px-2 py-0.5 rounded ${isActive ? 'bg-blue-700 text-white' : 'bg-slate-800 text-slate-300'}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}

              <div className="pt-6 px-3 py-2 text-[11px] font-semibold tracking-wider text-slate-400 uppercase">
                Sauvegarde Fichier
              </div>

              <div className="px-2 space-y-2">
                <button
                  onClick={handleExportJSON}
                  className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium bg-slate-800/80 hover:bg-slate-800 text-slate-200 border border-slate-700 transition-colors"
                >
                  <Icons.Download className="w-3.5 h-3.5 text-blue-400" />
                  <span>Exporter sauvegarde JSON</span>
                </button>

                <label className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium bg-slate-800/80 hover:bg-slate-800 text-slate-200 border border-slate-700 transition-colors cursor-pointer">
                  <Icons.Upload className="w-3.5 h-3.5 text-emerald-400" />
                  <span>Importer sauvegarde JSON</span>
                  <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                </label>
              </div>
            </nav>

            <div className="p-4 border-t border-slate-800 bg-slate-900/80 space-y-2">
              <div className="flex items-center justify-between text-xs text-slate-400">
                <span className="truncate">Connecté : <strong className="text-white">{currentUser ? currentUser.name : '...'}</strong></span>
                <button
                  onClick={handleLogout}
                  className="text-rose-400 hover:text-rose-300 text-[11px] font-medium hover:underline flex items-center gap-1 shrink-0 ml-2"
                >
                  <Icons.LogOut className="w-3 h-3" />
                  <span>Déconnexion</span>
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <div className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
            {/* TOP HEADER */}
            <header className="h-16 border-b border-slate-200 bg-white px-6 flex items-center justify-between gap-8 shrink-0 no-print">
              <div className="flex items-center gap-2 text-xs text-slate-500">
                <span className="font-semibold text-slate-900">FCI Contrôle Interne</span>
                <span>/</span>
                <span className="capitalize">{activeView.replace('-', ' ')}</span>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={handleExportCurrentViewExcel}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-300 rounded-lg hover:bg-emerald-100 transition-colors shadow-xs"
                >
                  <Icons.FileSpreadsheet className="w-3.5 h-3.5 text-emerald-600" />
                  <span>Exporter Excel</span>
                </button>

                <button
                  onClick={() => window.print()}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors shadow-xs"
                >
                  <Icons.Printer className="w-3.5 h-3.5 text-slate-500" />
                  <span>Imprimer</span>
                </button>

                {activeView !== 'new-control' && (
                  <button
                    onClick={() => {
                      setEditingSheet(null);
                      setActiveView('new-control');
                    }}
                    className="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors shadow-xs"
                  >
                    <Icons.Plus className="w-4 h-4" />
                    <span>Nouveau contrôle</span>
                  </button>
                )}

                <div className="pl-3 border-l border-slate-200 flex items-center gap-3">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span className="text-xs font-semibold text-slate-800">
                      Connecté : {currentUser ? currentUser.name : '...'}
                    </span>
                    {currentUser && (
                      <span className="hidden sm:inline-block text-[11px] text-slate-400 font-normal">
                        ({currentUser.role === 'siege' ? 'Siège' : 'Contrôleur'})
                      </span>
                    )}
                  </div>
                  <button
                    onClick={handleLogout}
                    title="Déconnexion"
                    className="inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 border border-slate-200 rounded-lg transition-colors"
                  >
                    <Icons.LogOut className="w-3.5 h-3.5" />
                    <span>Déconnexion</span>
                  </button>
                </div>
              </div>
            </header>

            {/* VIEWPORT */}
            <main className="flex-1 overflow-y-auto p-6 lg:p-8 bg-slate-50">
              <div className="max-w-7xl mx-auto">
                {/* 1. DASHBOARD VIEW */}
                {activeView === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900 tracking-tight">
                          Tableau de bord de Contrôle Interne
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">
                          Vue synthétique des missions d'inspection, niveau de conformité et suivi des recommandations.
                        </p>
                      </div>
                      <div className="flex flex-wrap items-center gap-2 no-print">
                        <button
                          onClick={handleExportDashboardExcel}
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-300 rounded-lg hover:bg-emerald-100 transition-colors shadow-xs"
                        >
                          <Icons.FileSpreadsheet className="w-3.5 h-3.5 text-emerald-600" />
                          <span>Exporter en Excel (.xlsx)</span>
                        </button>
                        <button
                          onClick={() => window.print()}
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors shadow-xs"
                        >
                          <Icons.Printer className="w-3.5 h-3.5 text-slate-500" />
                          <span>Imprimer / PDF</span>
                        </button>
                      </div>
                    </div>

                    {/* KPI Strip */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                        <div className="flex justify-between text-xs text-slate-500 font-medium">
                          <span>Contrôles enregistrés</span>
                          <Icons.FileCheck2 className="w-4 h-4 text-blue-600" />
                        </div>
                        <div className="mt-3 flex items-baseline gap-2">
                          <span className="text-2xl font-bold font-mono text-slate-900">{totalCount}</span>
                          <span className="text-xs text-slate-500">fiches actives</span>
                        </div>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                        <div className="flex justify-between text-xs text-slate-500 font-medium">
                          <span>Taux de conformité</span>
                          <Icons.CheckCircle2 className="w-4 h-4 text-emerald-600" />
                        </div>
                        <div className="mt-3 flex items-baseline gap-2">
                          <span className="text-2xl font-bold font-mono text-slate-900">{complianceRate}%</span>
                          <span className="text-xs text-emerald-700 font-medium">Global</span>
                        </div>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                        <div className="flex justify-between text-xs text-slate-500 font-medium">
                          <span>Constats en suspens</span>
                          <Icons.AlertTriangle className="w-4 h-4 text-amber-500" />
                        </div>
                        <div className="mt-3 flex items-baseline gap-2">
                          <span className="text-2xl font-bold font-mono text-slate-900">{openFindings.length}</span>
                          <span className="text-xs text-amber-600 font-medium">à régulariser</span>
                        </div>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                        <div className="flex justify-between text-xs text-slate-500 font-medium">
                          <span>Plans d'actions en cours</span>
                          <Icons.Clock className="w-4 h-4 text-indigo-600" />
                        </div>
                        <div className="mt-3 flex items-baseline gap-2">
                          <span className="text-2xl font-bold font-mono text-slate-900">
                            {allFindings.filter(f => f.status === 'En cours').length}
                          </span>
                          <span className="text-xs text-slate-500">en déploiement</span>
                        </div>
                      </div>
                    </div>

                    {/* Recent Controls List */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-xs p-5">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="text-sm font-bold text-slate-900">Fiches de contrôle récentes</h3>
                        <button onClick={() => setActiveView('controls')} className="text-xs text-blue-600 font-semibold hover:underline">
                          Voir la liste complète
                        </button>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="border-b border-slate-200 text-slate-500 font-medium bg-slate-50">
                              <th className="py-2 px-3">Réf.</th>
                              <th className="py-2 px-3">Intitulé</th>
                              <th className="py-2 px-3">Direction</th>
                              <th className="py-2 px-3">Date</th>
                              <th className="py-2 px-3">Statut</th>
                              <th className="py-2 px-3 text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {sheets.slice(0, 5).map(sheet => (
                              <tr key={sheet.id} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-2.5 px-3 font-mono font-bold text-slate-900">{sheet.ref}</td>
                                <td className="py-2.5 px-3 font-medium text-slate-800">{sheet.title}</td>
                                <td className="py-2.5 px-3 text-slate-600">{sheet.department}</td>
                                <td className="py-2.5 px-3 font-mono text-slate-500">{sheet.controlDate}</td>
                                <td className="py-2.5 px-3">
                                  <span className={`px-2 py-0.5 rounded text-[11px] font-medium border ${
                                    sheet.status === 'Conforme' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' :
                                    sheet.status === 'Conforme avec réserves' ? 'bg-amber-50 text-amber-800 border-amber-200' :
                                    sheet.status === 'Non conforme' ? 'bg-rose-50 text-rose-800 border-rose-200' :
                                    'bg-slate-100 text-slate-700 border-slate-200'
                                  }`}>
                                    {sheet.status}
                                  </span>
                                </td>
                                <td className="py-2.5 px-3 text-right">
                                  <button
                                    onClick={() => setDetailModalSheet(sheet)}
                                    className="p-1 text-slate-500 hover:text-blue-600 transition-colors"
                                    title="Consulter"
                                  >
                                    <Icons.Eye className="w-4 h-4 inline" />
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. CONTROLS LIST VIEW */}
                {activeView === 'controls' && (
                  <div className="space-y-5">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900 tracking-tight">
                          Gestion des Fiches de Contrôle
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">
                          Consultez, filtrez et mettez à jour le référentiel des contrôles de conformité.
                        </p>
                      <div className="flex flex-wrap items-center gap-2 no-print">
                        <button
                          onClick={() => handleExportControlSheetsExcel(filteredSheets)}
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-300 rounded-lg hover:bg-emerald-100 transition-colors shadow-xs"
                        >
                          <Icons.FileSpreadsheet className="w-3.5 h-3.5 text-emerald-600" />
                          <span>Exporter en Excel (.xlsx)</span>
                        </button>
                        <button
                          onClick={() => window.print()}
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors shadow-xs"
                        >
                          <Icons.Printer className="w-3.5 h-3.5 text-slate-500" />
                          <span>Imprimer / PDF</span>
                        </button>
                        <button
                          onClick={() => { setEditingSheet(null); setActiveView('new-control'); }}
                          className="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors shadow-xs"
                        >
                          <Icons.Plus className="w-4 h-4" />
                          <span>Nouveau contrôle</span>
                        </button>
                      </div>
                    </div>

                    {/* Filter toolbar */}
                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs space-y-3">
                      <div className="flex flex-col md:flex-row gap-3">
                        <div className="relative flex-1">
                          <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                          <input
                            type="text"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            placeholder="Rechercher par référence, intitulé, direction..."
                            className="w-full text-xs pl-9 pr-9 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-500"
                          />
                        </div>

                        <select
                          value={selectedStatus}
                          onChange={(e) => setSelectedStatus(e.target.value)}
                          className="bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-2.5 py-2 text-xs"
                        >
                          <option value="Tous">Tous les statuts</option>
                          <option value="Conforme">Conforme</option>
                          <option value="Conforme avec réserves">Conforme avec réserves</option>
                          <option value="Non conforme">Non conforme</option>
                          <option value="En attente">En attente</option>
                        </select>

                        <select
                          value={selectedRisk}
                          onChange={(e) => setSelectedRisk(e.target.value)}
                          className="bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-2.5 py-2 text-xs"
                        >
                          <option value="Tous">Tous les risques</option>
                          <option value="Critique">Critique</option>
                          <option value="Élevé">Élevé</option>
                          <option value="Modéré">Modéré</option>
                          <option value="Faible">Faible</option>
                        </select>
                      </div>
                    </div>

                    {/* Table */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="border-b border-slate-200 text-slate-500 font-medium bg-slate-50/70">
                            <th className="py-3 px-3">Réf.</th>
                            <th className="py-3 px-3">Intitulé & Processus</th>
                            <th className="py-3 px-3">Direction</th>
                            <th className="py-3 px-3">Date</th>
                            <th className="py-3 px-3">Risque</th>
                            <th className="py-3 px-3">Statut</th>
                            <th className="py-3 px-3 text-center">Constats</th>
                            <th className="py-3 px-3 text-right">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredSheets.map(sheet => (
                            <tr key={sheet.id} className="hover:bg-slate-50/80 transition-colors">
                              <td className="py-3 px-3 font-mono font-bold text-slate-900 whitespace-nowrap">{sheet.ref}</td>
                              <td className="py-3 px-3">
                                <div className="font-semibold text-slate-900">{sheet.title}</div>
                                <div className="text-[11px] text-slate-500">{sheet.process}</div>
                              </td>
                              <td className="py-3 px-3 text-slate-600 whitespace-nowrap">{sheet.department}</td>
                              <td className="py-3 px-3 font-mono text-slate-700 whitespace-nowrap">{sheet.controlDate}</td>
                              <td className="py-3 px-3 whitespace-nowrap font-medium text-slate-700">{sheet.riskLevel}</td>
                              <td className="py-3 px-3 whitespace-nowrap">
                                <span className={`px-2 py-0.5 rounded text-[11px] font-medium border ${
                                  sheet.status === 'Conforme' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' :
                                  sheet.status === 'Conforme avec réserves' ? 'bg-amber-50 text-amber-800 border-amber-200' :
                                  sheet.status === 'Non conforme' ? 'bg-rose-50 text-rose-800 border-rose-200' :
                                  'bg-slate-100 text-slate-700 border-slate-200'
                                }`}>
                                  {sheet.status}
                                </span>
                              </td>
                              <td className="py-3 px-3 text-center font-mono font-semibold">
                                {sheet.findings.length}
                              </td>
                              <td className="py-3 px-3 text-right whitespace-nowrap">
                                <div className="inline-flex items-center gap-1">
                                  <button
                                    onClick={() => setDetailModalSheet(sheet)}
                                    className="p-1 text-slate-500 hover:text-blue-600 transition-colors"
                                    title="Consulter"
                                  >
                                    <Icons.Eye className="w-3.5 h-3.5" />
                                  </button>
                                  <button
                                    onClick={() => { setEditingSheet(sheet); setActiveView('new-control'); }}
                                    className="p-1 text-slate-500 hover:text-slate-800 transition-colors"
                                    title="Modifier"
                                  >
                                    <Icons.Edit3 className="w-3.5 h-3.5" />
                                  </button>
                                  <button
                                    onClick={() => handleDuplicateSheet(sheet)}
                                    className="p-1 text-slate-500 hover:text-slate-800 transition-colors"
                                    title="Dupliquer"
                                  >
                                    <Icons.Copy className="w-3.5 h-3.5" />
                                  </button>
                                  <button
                                    onClick={() => handleDeleteSheet(sheet.id)}
                                    className="p-1 text-slate-400 hover:text-rose-600 transition-colors"
                                    title="Supprimer"
                                  >
                                    <Icons.Trash2 className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* 3. NEW / EDIT FORM VIEW */}
                {activeView === 'new-control' && (
                  <ControlForm
                    initialSheet={editingSheet}
                    onSave={handleSaveSheet}
                    onCancel={() => { setEditingSheet(null); setActiveView('controls'); }}
                  />
                )}

                {/* 4. FINDINGS REGISTRY VIEW */}
                {activeView === 'findings' && (
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900 tracking-tight">
                          Registre des Constats & Recommandations
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">
                          Suivi transversal des écarts relevés et des plans d'action correctifs.
                        </p>
                      </div>
                      <div className="flex flex-wrap items-center gap-2 no-print">
                        <button
                          onClick={handleExportFindingsExcel}
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-300 rounded-lg hover:bg-emerald-100 transition-colors shadow-xs"
                        >
                          <Icons.FileSpreadsheet className="w-3.5 h-3.5 text-emerald-600" />
                          <span>Exporter en Excel (.xlsx)</span>
                        </button>
                        <button
                          onClick={() => window.print()}
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors shadow-xs"
                        >
                          <Icons.Printer className="w-3.5 h-3.5 text-slate-500" />
                          <span>Imprimer / PDF</span>
                        </button>
                      </div>
                    </div>

                    <div className="space-y-4">
                      {allFindings.map(finding => (
                        <div key={finding.id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs space-y-3">
                          <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-2 border-b border-slate-100 pb-3">
                            <div>
                              <div className="flex items-center gap-2 text-xs">
                                <span className="font-mono font-bold bg-slate-100 px-2 py-0.5 rounded border border-slate-200">{finding.ref}</span>
                                <span className="font-semibold text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">{finding.severity}</span>
                                <span className="text-slate-500 font-medium">{finding.category}</span>
                              </div>
                              <h3 className="text-sm font-bold text-slate-900 mt-1">{finding.title}</h3>
                            </div>

                            <div className="flex items-center gap-2">
                              <span className="text-xs text-slate-500">Statut :</span>
                              <select
                                value={finding.status}
                                onChange={(e) => handleUpdateFindingStatus(finding.sheetId, finding.id, e.target.value)}
                                className="text-xs font-semibold bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5"
                              >
                                <option value="À traiter">À traiter</option>
                                <option value="En cours">En cours</option>
                                <option value="Clôturé">Clôturé</option>
                                <option value="En retard">En retard</option>
                              </select>
                            </div>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                              <span className="font-semibold text-slate-700 block mb-1">Constat factuel :</span>
                              <p className="text-slate-600">{finding.description}</p>
                            </div>
                            <div className="bg-blue-50/50 p-3 rounded-lg border border-blue-100">
                              <span className="font-semibold text-blue-900 block mb-1">Recommandation :</span>
                              <p className="text-slate-700">{finding.recommendation}</p>
                            </div>
                          </div>

                          <div className="flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-500">
                            <div>
                              <span>Responsable : <strong>{finding.assignee}</strong></span>
                              <span className="mx-2">·</span>
                              <span>Échéance : <strong className="font-mono">{finding.targetDate}</strong></span>
                            </div>
                            <button
                              onClick={() => setDetailModalSheet(finding.parentSheet)}
                              className="text-blue-600 hover:underline font-semibold"
                            >
                              Fiche : {finding.sheetRef}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 5. METHODOLOGY GUIDE */}
                {activeView === 'methodology' && (
                  <div className="space-y-6 max-w-4xl">
                    <div className="pb-2 border-b border-slate-200">
                      <h2 className="text-xl font-bold text-slate-900 tracking-tight">Guide Méthodologique du Contrôle Interne</h2>
                      <p className="text-xs text-slate-500 mt-0.5">Cadre de référence, définition des risques et échantillonnage (COSO & IFACI).</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-3 text-xs leading-relaxed">
                      <h3 className="font-bold text-slate-900 text-sm">Principes directeurs</h3>
                      <p className="text-slate-700">
                        La Fiche de Contrôle Intelligente (FCI) formalise les vérifications de conformité et mesure l'efficacité des processus. Chaque anomalie doit comporter un niveau de gravité, un risque identifié, un plan d'action précis, un responsable opérationnel et une date cible d'échéance.
                      </p>
                    </div>
                  </div>
                )}
              </div>
            </main>
          </div>

          {/* DETAIL REPORT MODAL */}
          {detailModalSheet && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl border border-slate-200 max-w-4xl w-full shadow-2xl max-h-[92vh] flex flex-col">
                <div className="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between no-print">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-xs font-bold text-slate-900 bg-white px-2.5 py-1 rounded border border-slate-200">
                      {detailModalSheet.ref}
                    </span>
                    <span className="text-xs text-slate-500">Rapport de Contrôle Interne</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleExportSingleSheetExcel(detailModalSheet)}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-emerald-700 bg-white border border-emerald-300 rounded-lg hover:bg-emerald-50 shadow-xs"
                    >
                      <Icons.FileSpreadsheet className="w-3.5 h-3.5 text-emerald-600" />
                      <span>Exporter Excel (.xlsx)</span>
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 shadow-xs"
                    >
                      <Icons.Printer className="w-3.5 h-3.5" />
                      <span>Imprimer / PDF</span>
                    </button>
                    <button
                      onClick={() => setDetailModalSheet(null)}
                      className="p-1.5 text-slate-400 hover:text-slate-700 rounded-lg"
                    >
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="p-8 overflow-y-auto space-y-6 text-slate-800 printable-sheet">
                  <div className="border border-slate-300 rounded-xl p-5 bg-slate-50/50 space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-xs font-bold text-blue-700 uppercase">FCI · Fiche de Contrôle</span>
                        <h1 className="text-lg font-bold text-slate-950 mt-1">{detailModalSheet.title}</h1>
                      </div>
                      <span className="px-3 py-1 rounded text-xs font-bold border bg-white">
                        {detailModalSheet.status}
                      </span>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs pt-2 border-t border-slate-200">
                      <div><span className="text-slate-500 block">Direction :</span><strong>{detailModalSheet.department}</strong></div>
                      <div><span className="text-slate-500 block">Processus :</span><strong>{detailModalSheet.process}</strong></div>
                      <div><span className="text-slate-500 block">Date :</span><strong className="font-mono">{detailModalSheet.controlDate}</strong></div>
                      <div><span className="text-slate-500 block">Périodicité :</span><strong>{detailModalSheet.periodicity}</strong></div>
                    </div>
                  </div>

                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider mb-1">Objectifs du contrôle</h3>
                    <p className="text-xs text-slate-700 bg-white p-3 rounded-lg border border-slate-200">{detailModalSheet.objectives}</p>
                  </div>

                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider mb-1">Méthodologie & Échantillonnage</h3>
                    <p className="text-xs text-slate-700 bg-white p-3 rounded-lg border border-slate-200">{detailModalSheet.methodology} (Échantillon : {detailModalSheet.sampleSize})</p>
                  </div>

                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider mb-1">Conclusion de l'évaluateur</h3>
                    <p className="text-xs text-slate-800 bg-blue-50/40 p-3 rounded-lg border border-blue-200 font-medium">{detailModalSheet.conclusion}</p>
                  </div>

                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider mb-2">Constats & Recommandations ({detailModalSheet.findings.length})</h3>
                    {detailModalSheet.findings.map(f => (
                      <div key={f.id} className="border border-slate-200 rounded-lg p-3 bg-white space-y-2 mb-2 text-xs">
                        <div className="flex justify-between font-bold">
                          <span>{f.ref} - {f.title}</span>
                          <span className="text-rose-700">{f.severity}</span>
                        </div>
                        <p className="text-slate-600"><strong>Constat :</strong> {f.description}</p>
                        <p className="text-slate-700"><strong>Recommandation :</strong> {f.recommendation}</p>
                        <div className="text-[11px] text-slate-500 pt-1 border-t border-slate-100 flex justify-between">
                          <span>Responsable : {f.assignee}</span>
                          <span>Échéance : {f.targetDate}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TOAST FEEDBACK */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2">
              <Icons.CheckCircle2 className="w-4 h-4 text-emerald-400" />
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    // --- CONTROL FORM COMPONENT ---
    function ControlForm({ initialSheet, onSave, onCancel }) {
      const [ref, setRef] = useState(initialSheet?.ref || `FCI-2026-${Math.floor(100 + Math.random() * 900)}`);
      const [title, setTitle] = useState(initialSheet?.title || '');
      const [department, setDepartment] = useState(initialSheet?.department || 'Direction Financière & Comptable');
      const [process, setProcess] = useState(initialSheet?.process || '');
      const [controller, setController] = useState(
        initialSheet?.controller ||
        (initialSheet?.controleur_id === 'ctrl-b' ? 'OUJBOUR OMAR (Contrôleur B)' : 'AIT BABA ISMAIL (Contrôleur A)')
      );
      const [auditee, setAuditee] = useState(initialSheet?.auditee || '');
      const [controlDate, setControlDate] = useState(initialSheet?.controlDate || new Date().toISOString().split('T')[0]);
      const [periodicity, setPeriodicity] = useState(initialSheet?.periodicity || 'Trimestriel');
      const [type, setType] = useState(initialSheet?.type || 'Contrôle de 2nd niveau');
      const [riskLevel, setRiskLevel] = useState(initialSheet?.riskLevel || 'Modéré');
      const [status, setStatus] = useState(initialSheet?.status || 'Conforme avec réserves');
      const [objectives, setObjectives] = useState(initialSheet?.objectives || '');
      const [methodology, setMethodology] = useState(initialSheet?.methodology || '');
      const [sampleSize, setSampleSize] = useState(initialSheet?.sampleSize || '');
      const [conclusion, setConclusion] = useState(initialSheet?.conclusion || '');
      const [findings, setFindings] = useState(initialSheet?.findings || []);

      const handleAddFinding = () => {
        const newF = {
          id: `fnd-${Date.now()}`,
          ref: `CST-0${findings.length + 1}`,
          title: '',
          severity: 'Majeur',
          category: 'Conformité réglementaire',
          description: '',
          risk: '',
          recommendation: '',
          actionPlan: '',
          assignee: auditee || 'Responsable de service',
          targetDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'À traiter',
          createdAt: new Date().toISOString()
        };
        setFindings([...findings, newF]);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) {
          alert('Veuillez renseigner un intitulé de contrôle.');
          return;
        }
        const derivedControleurId =
          controller.includes('OUJBOUR OMAR') || controller.includes('Contrôleur B')
            ? 'ctrl-b'
            : 'ctrl-a';

        onSave({
          id: initialSheet?.id || `fci-${Date.now()}`,
          controleur_id: initialSheet?.controleur_id || derivedControleurId,
          date: controlDate,
          ref,
          title,
          department,
          process: process || 'Processus standard',
          controller,
          auditee,
          controlDate,
          periodicity,
          type,
          riskLevel,
          status,
          objectives: objectives || 'Objectif de conformité générale.',
          methodology: methodology || 'Revue documentaire.',
          sampleSize: sampleSize || 'Échantillon représentatif',
          conclusion: conclusion || 'Contrôle validé.',
          findings,
          createdAt: initialSheet?.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
      };

      return (
