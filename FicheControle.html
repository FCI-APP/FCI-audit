<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCI v1.0 - Feuille 3 : Fiche de Contrôle</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .mission-header {
            background: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: left;
            font-size: 0.85em;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        input[type="text"] {
            width: 95%;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .tc-cell {
            font-weight: bold;
            text-align: center;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85em;
            color: #64748b;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FCI v1.0 — Feuille 3 : Fiche de Contrôle</h1>
    
    <div class="mission-header" id="missionHeaderInfo">
        <div>Mission ID : <span id="infoId">--</span></div>
        <div>Date : <span id="infoDate">--</span></div>
        <div>Période : <span id="infoPeriode">--</span></div>
        <div>Entité : <span id="infoEntite">--</span></div>
        <div>Contrôleur : <span id="infoControleur">--</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Processus</th>
                <th>Risque</th>
                <th>Contrôle</th>
                <th>PC</th>
                <th style="width: 70px;">Pop</th>
                <th style="width: 70px;">Ech</th>
                <th style="width: 70px;">OK</th>
                <th style="width: 70px;">KO</th>
                <th style="width: 70px;">TC (%)</th>
                <th>Constat / Remarques</th>
            </tr>
        </thead>
        <tbody id="ficheControleBody">
            <!-- Rempli dynamiquement -->
        </tbody>
    </table>

    <div class="btn-container">
        <button onclick="sauvegarderFiche()">Enregistrer la Fiche dans la BDD</button>
    </div>

    <footer>Fiche de contrôle intelligente (FCI)
v1.0 © 2026 - 2027</footer>
</div>

<!-- 1. Script du Gestionnaire de BDD Centralisée -->
<script src="fci-db-manager.js"></script>

<!-- 2. Logiciel applicatif -->
<script>
    let activeMission = null;

    document.addEventListener('DOMContentLoaded', () => {
        const savedMission = localStorage.getItem('fci_fiche_controle_active');
        if (savedMission) {
            activeMission = JSON.parse(savedMission);
            document.getElementById('infoId').textContent = activeMission.idMission || '--';
            document.getElementById('infoDate').textContent = activeMission.date || '--';
            document.getElementById('infoPeriode').textContent = `${activeMission.dateDebut || ''} au ${activeMission.dateFin || ''}`;
            document.getElementById('infoEntite').textContent = activeMission.entite || '--';
            document.getElementById('infoControleur').textContent = activeMission.controleur || '--';

            genererTableauControle(activeMission.pointsSelectionnes || []);
        } else {
            document.getElementById('ficheControleBody').innerHTML = '<tr><td colspan="10" style="text-align:center;">Aucune mission active trouvée. Veuillez valider la Feuille 2 (Planification).</td></tr>';
        }
    });

    function getItemVal(item, keys) {
        for (let k of keys) {
            if (item && item[k] !== undefined) return item[k];
        }
        return '';
    }

    function genererTableauControle(points) {
        const tbody = document.getElementById('ficheControleBody');
        tbody.innerHTML = '';

        points.forEach((pt, index) => {
            const tr = document.createElement('tr');
            tr.dataset.index = index;

            const proc = getItemVal(pt, ['Processus', 'processus']);
            const rsk = getItemVal(pt, ['Intitulé du risque', 'Intitulé risque', 'risque']);
            const ctrl = getItemVal(pt, ['Points de contrôle', 'Point de contrôle', 'controle']);
            const pc = getItemVal(pt, ['Intitulé du contrôle', 'Intitulé contrôle', 'pc']);

            tr.innerHTML = `
                <td>${proc}</td>
                <td>${rsk}</td>
                <td>${ctrl}</td>
                <td>${pc}</td>
                <td><input type="number" min="0" value="0" class="input-pop" onchange="mettreAJourCalcul(${index})"></td>
                <td><input type="number" min="0" value="0" class="input-ech" onchange="mettreAJourCalcul(${index})"></td>
                <td><input type="number" min="0" value="0" class="input-ok" onchange="mettreAJourCalcul(${index})"></td>
                <td><input type="number" min="0" value="0" class="input-ko" onchange="mettreAJourCalcul(${index})"></td>
                <td class="tc-cell" id="tc-${index}">0.0%</td>
                <td><input type="text" class="input-constat" placeholder="Saisir un constat..."></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function mettreAJourCalcul(index) {
        const tr = document.querySelector(`tr[data-index="${index}"]`);
        if (!tr) return;

        let pop = parseInt(tr.querySelector('.input-pop').value) || 0;
        let ech = parseInt(tr.querySelector('.input-ech').value) || 0;
        let ok = parseInt(tr.querySelector('.input-ok').value) || 0;
        let ko = parseInt(tr.querySelector('.input-ko').value) || 0;

        // Contrôle Échantillon <= Population
        if (ech > pop) {
            alert("Erreur : L'échantillon ne peut pas être supérieur à la population !");
            tr.querySelector('.input-ech').value = 0;
            ech = 0;
        }

        // Ajustement automatique OK + KO <= Echantillon
        if ((ok + ko) > ech && ech > 0) {
            ko = Math.max(0, ech - ok);
            tr.querySelector('.input-ko').value = ko;
        }

        // Calcul du Taux de Conformité TC
        let tc = 0;
        if (ech > 0) {
            tc = ((ok / ech) * 100).toFixed(1);
        }

        tr.querySelector(`#tc-${index}`).textContent = tc + '%';
    }

    function sauvegarderFiche() {
        if (!activeMission) {
            alert('Aucune mission active.');
            return;
        }

        const rows = document.querySelectorAll('#ficheControleBody tr');
        rows.forEach((tr, index) => {
            const cells = tr.querySelectorAll('td');
            if (cells.length < 10) return;

            const pop = parseInt(tr.querySelector('.input-pop').value) || 0;
            const ech = parseInt(tr.querySelector('.input-ech').value) || 0;
            const ok = parseInt(tr.querySelector('.input-ok').value) || 0;
            const ko = parseInt(tr.querySelector('.input-ko').value) || 0;
            const tcStr = tr.querySelector(`#tc-${index}`).textContent.replace('%', '');
            const tc = parseFloat(tcStr) || 0;
            const constat = tr.querySelector('.input-constat').value;

            const dataConstat = {
                idConstat: `CST-${activeMission.idMission}-${index + 1}`,
                idMission: activeMission.idMission,
                date: new Date().toISOString().slice(0, 10),
                processus: cells[0].textContent,
                risque: cells[1].textContent,
                controle: cells[2].textContent,
                pc: cells[3].textContent,
                pop: pop,
                ech: ech,
                ok: ok,
                ko: ko,
                tc: tc,
                constat: constat
            };

            // Sauvegarde directe dans la BDD Centralisée
            FCIDatabase.enregistrerConstatControle(dataConstat);
        });

        alert('L\'ensemble des constats de la fiche de contrôle a été enregistré dans la BDD Centralisée !');
    }
</script>
</body>
</html>
